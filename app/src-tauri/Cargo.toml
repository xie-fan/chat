[package]
name = "chat-app"
version = "0.1.0"
edition = "2021"
description = "Chat client"

[lib]
name = "chat_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
# tauri::generate_context! 展开后直接引用 ::serde_json
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# MM4 下载地址校验（复用依赖树里已有的 crate）
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# 开机自启只有桌面平台（Android 不编译这个插件）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
# 在线更新（Windows 安装包；Android 走下载 APK）
tauri-plugin-updater = "2"
# MM4 桌面下载：reqwest 流式 GET（rustls-no-provider 与 updater 共栈）；Android 走 Kotlin MediaStore 插件
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider", "json"] }
# rustls-no-provider 不带默认加密提供者，构建 Client 前手动装 ring（与 updater 相同做法）
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
base64 = "0.22"
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
gtk = "0.18"
ksni = "0.3.7"
libc = "0.2"
notify-rust = "4.18"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["multipart"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError"] }
objc2-user-notifications = { version = "0.3", features = ["block2", "UNUserNotificationCenter"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"
tauri-winrt-notification = "0.7.3"
windows = { version = "0.61", features = ["UI_Notifications", "Data_Xml_Dom", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
